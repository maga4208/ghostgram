name: Build Ghostgram Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go for VLESS VPN core
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'

      - name: Build VLESS VPN core
        run: |
          if [ -f "Ghostgram/Features/Vless/Core/build-core.sh" ]; then
            chmod +x Ghostgram/Features/Vless/Core/build-core.sh
            ./Ghostgram/Features/Vless/Core/build-core.sh
          fi

      - name: Setup Fake Codesigning & Config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          mkdir -p build-system/ghostgram-codesigning/certs
          mkdir -p build-system/ghostgram-codesigning/profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Генерируем свежий самоподписанный сертификат (встроенный в репо истёк 30.10.2026)
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout fake_key.pem -out fake_cert.pem -days 3650 \
            -subj "/CN=Apple Development: Fake (0000000000)/OU=FakeTeam/O=Fake/C=US"
          /usr/bin/openssl x509 -in fake_cert.pem -outform DER -out fake_cert.der
          /usr/bin/openssl pkcs12 -export -inkey fake_key.pem -in fake_cert.pem \
            -passout pass: -out build-system/ghostgram-codesigning/certs/fake.p12

          # Импортируем свежий сертификат в разблокированный Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/fake.keychain
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import build-system/ghostgram-codesigning/certs/fake.p12 -k "$KEYCHAIN_PATH" -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # Продлеваем ExpirationDate во всех fake .mobileprovision до 2035 года
          python3 - << 'EOF'
          import datetime, glob, json, os, plistlib, subprocess

          with open('fake_cert.der', 'rb') as cf:
              cert_der = cf.read()

          team_id = None
          for prof_path in glob.glob('build-system/fake-codesigning/profiles/*.mobileprovision'):
              raw_xml = subprocess.check_output(['security', 'cms', '-D', '-i', prof_path])
              plist = plistlib.loads(raw_xml)
              plist['ExpirationDate'] = datetime.datetime(2035, 1, 1, 0, 0, 0)
              plist['DeveloperCertificates'] = [cert_der]
              if team_id is None:
                  team_id = plist['TeamIdentifier'][0]

              with open('updated.plist', 'wb') as out_p:
                  plistlib.dump(plist, out_p)

              out_prof = os.path.join('build-system/ghostgram-codesigning/profiles', os.path.basename(prof_path))
              subprocess.check_call([
                  '/usr/bin/openssl', 'smime', '-sign', '-nodetach', '-binary',
                  '-in', 'updated.plist', '-signer', 'fake_cert.pem', '-inkey', 'fake_key.pem',
                  '-outform', 'DER', '-out', out_prof
              ])
              subprocess.check_call(['cp', out_prof, os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/')])

          with open('build-system/ghostgram-configuration.example.json', 'r') as f:
              cfg = json.load(f)

          cfg['api_id'] = int(os.environ['TG_API_ID'])
          cfg['api_hash'] = os.environ['TG_API_HASH']
          cfg['team_id'] = team_id
          cfg['bundle_id'] = 'ph.telegra.Telegraph'

          with open('build-system/ghostgram-configuration.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          EOF
          rm -f fake_key.pem fake_cert.pem fake_cert.der updated.plist

      - name: Build Ghostgram IPA
        run: |
          chmod +x build-system/GGBuildRelease.sh
          ./build-system/GGBuildRelease.sh 100
          mkdir -p release-artifact
          IPA_FILE=$(find build-output -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            IPA_FILE=$(find . -maxdepth 5 -name "*.ipa" -not -path "./.git/*" | head -n 1)
          fi
          echo "Found IPA: $IPA_FILE"
          cp "$IPA_FILE" release-artifact/Ghostgram-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-unsigned-IPA
          path: release-artifact/Ghostgram-unsigned.ipa
          retention-days: 7
