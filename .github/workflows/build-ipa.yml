name: Build Ghostgram Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go for VLESS VPN core
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'

      - name: Build VLESS VPN core
        run: |
          if [ -f "Ghostgram/Features/Vless/Core/build-core.sh" ]; then
            chmod +x Ghostgram/Features/Vless/Core/build-core.sh
            ./Ghostgram/Features/Vless/Core/build-core.sh
          fi

      - name: Setup Fake Codesigning & Config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - << 'EOF'
          import datetime, glob, json, os, plistlib, shutil, subprocess

          os.makedirs('build-system/ghostgram-codesigning/certs', exist_ok=True)
          os.makedirs('build-system/ghostgram-codesigning/profiles', exist_ok=True)
          user_profiles_dir = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          os.makedirs(user_profiles_dir, exist_ok=True)

          for item in glob.glob('build-system/fake-codesigning/certs/*'):
              shutil.copy2(item, 'build-system/ghostgram-codesigning/certs/')

          p12_files = glob.glob('build-system/fake-codesigning/certs/*.p12')
          orig_p12 = p12_files[0]
          p12_name = os.path.basename(orig_p12)

          # Извлекаем ключ и сертификат из родного .p12 репозитория
          p12_pw = ''
          for candidate in ['', 'password', '1234', '123456']:
              res = subprocess.run(
                  ['openssl', 'pkcs12', '-legacy', '-in', orig_p12, '-passin', f'pass:{candidate}', '-nodes', '-nocerts'],
                  capture_output=True
              )
              if res.returncode != 0:
                  res = subprocess.run(
                      ['/usr/bin/openssl', 'pkcs12', '-in', orig_p12, '-passin', f'pass:{candidate}', '-nodes', '-nocerts'],
                      capture_output=True
                  )
              if res.returncode == 0 and b'PRIVATE KEY' in res.stdout:
                  p12_pw = candidate
                  subprocess.run(['/usr/bin/openssl', 'pkey', '-out', 'fake_key.pem'], input=res.stdout, check=True)
                  break

          res_cert = subprocess.run(
              ['openssl', 'pkcs12', '-legacy', '-in', orig_p12, '-passin', f'pass:{p12_pw}', '-nodes', '-nokeys'],
              capture_output=True
          )
          if res_cert.returncode != 0:
              res_cert = subprocess.run(
                  ['/usr/bin/openssl', 'pkcs12', '-in', orig_p12, '-passin', f'pass:{p12_pw}', '-nodes', '-nokeys'],
                  capture_output=True
              )
          subprocess.run(['/usr/bin/openssl', 'x509', '-out', 'orig_cert.pem'], input=res_cert.stdout, check=True)

          # Проверяем срок действия самого сертификата
          valid_check = subprocess.run(['/usr/bin/openssl', 'x509', '-in', 'orig_cert.pem', '-noout', '-checkend', '86400'])
          if valid_check.returncode == 0:
              print("Original certificate is valid, keeping original .p12")
              shutil.copy2('orig_cert.pem', 'fake_cert.pem')
          else:
              print("Original certificate expired, re-signing with same key and subject for 10 years")
              with open('ext.cnf', 'w') as ef:
                  ef.write("[v3_cs]\nbasicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n")
              subprocess.check_call(['/usr/bin/openssl', 'x509', '-x509toreq', '-in', 'orig_cert.pem', '-signkey', 'fake_key.pem', '-out', 'fake.csr'])
              subprocess.check_call([
                  '/usr/bin/openssl', 'x509', '-req', '-in', 'fake.csr', '-signkey', 'fake_key.pem',
                  '-days', '3650', '-extfile', 'ext.cnf', '-extensions', 'v3_cs', '-out', 'fake_cert.pem'
              ])
              subprocess.check_call([
                  'openssl', 'pkcs12', '-export', '-legacy',
                  '-certpbe', 'PBE-SHA1-3DES', '-keypbe', 'PBE-SHA1-3DES', '-macalg', 'sha1',
                  '-inkey', 'fake_key.pem', '-in', 'fake_cert.pem', '-passout', f'pass:{p12_pw}',
                  '-out', os.path.join('build-system/ghostgram-codesigning/certs', p12_name)
              ])

          subprocess.check_call(['/usr/bin/openssl', 'x509', '-in', 'fake_cert.pem', '-outform', 'DER', '-out', 'fake_cert.der'])
          with open('fake_cert.der', 'rb') as cf:
              cert_der = cf.read()

          for cer_file in glob.glob('build-system/ghostgram-codesigning/certs/*.cer'):
              with open(cer_file, 'wb') as cf:
                  cf.write(cert_der)

          # Импортируем PEM-файлы напрямую в Keychain (без ошибки PKCS12 MAC verification)
          keychain_path = os.path.join(os.environ['RUNNER_TEMP'], 'fake.keychain')
          subprocess.run(['security', 'create-keychain', '-p', '', keychain_path], check=False)
          subprocess.check_call(['security', 'set-keychain-settings', '-lut', '21600', keychain_path])
          subprocess.check_call(['security', 'unlock-keychain', '-p', '', keychain_path])
          subprocess.check_call(['security', 'import', 'fake_cert.pem', '-k', keychain_path, '-T', '/usr/bin/codesign', '-T', '/usr/bin/security'])
          subprocess.check_call(['security', 'import', 'fake_key.pem', '-k', keychain_path, '-T', '/usr/bin/codesign', '-T', '/usr/bin/security'])
          subprocess.run(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', '', keychain_path], check=False)
          subprocess.check_call(['security', 'list-keychains', '-d', 'user', '-s', keychain_path])

          # Обновляем ExpirationDate во всех .mobileprovision до 2035 года
          team_id = None
          for prof_path in glob.glob('build-system/fake-codesigning/profiles/*.mobileprovision'):
              raw_xml = subprocess.check_output(['security', 'cms', '-D', '-i', prof_path])
              plist = plistlib.loads(raw_xml)
              plist['ExpirationDate'] = datetime.datetime(2035, 1, 1, 0, 0, 0)
              plist['DeveloperCertificates'] = [cert_der]
              if team_id is None:
                  team_id = plist['TeamIdentifier'][0]

              with open('updated.plist', 'wb') as out_p:
                  plistlib.dump(plist, out_p)

              out_prof = os.path.join('build-system/ghostgram-codesigning/profiles', os.path.basename(prof_path))
              subprocess.check_call([
                  '/usr/bin/openssl', 'smime', '-sign', '-nodetach', '-binary',
                  '-in', 'updated.plist', '-signer', 'fake_cert.pem', '-inkey', 'fake_key.pem',
                  '-outform', 'DER', '-out', out_prof
              ])
              shutil.copy2(out_prof, user_profiles_dir)

          with open('build-system/ghostgram-configuration.example.json', 'r') as f:
              cfg = json.load(f)

          cfg['api_id'] = int(os.environ['TG_API_ID'])
          cfg['api_hash'] = os.environ['TG_API_HASH']
          cfg['team_id'] = team_id
          cfg['bundle_id'] = 'ph.telegra.Telegraph'

          with open('build-system/ghostgram-configuration.json', 'w') as f:
              json.dump(cfg, f, indent=2)

          for tmp in ['fake_key.pem', 'orig_cert.pem', 'fake_cert.pem', 'fake_cert.der', 'updated.plist', 'ext.cnf', 'fake.csr']:
              if os.path.exists(tmp):
                  os.remove(tmp)
          EOF

      - name: Build Ghostgram IPA
        run: |
          chmod +x build-system/GGBuildRelease.sh
          ./build-system/GGBuildRelease.sh 100
          mkdir -p release-artifact
          IPA_FILE=$(find build-output -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            IPA_FILE=$(find . -maxdepth 5 -name "*.ipa" -not -path "./.git/*" | head -n 1)
          fi
          echo "Found IPA: $IPA_FILE"
          cp "$IPA_FILE" release-artifact/Ghostgram-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-unsigned-IPA
          path: release-artifact/Ghostgram-unsigned.ipa
          retention-days: 7
